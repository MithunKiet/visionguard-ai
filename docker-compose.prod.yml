# Production overlay (Docker Compose >= 2.24.4).
# Run behind a TLS reverse proxy forwarding to 127.0.0.1:8080.
# Infrastructure and media ports remain private; see docs/REVIEW_FIXES.md.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  rabbitmq:
    ports: !reset []

  minio:
    ports: !reset []

  prometheus:
    ports: !reset []
    volumes: !override
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/capacity.rules.yml:/etc/prometheus/capacity.rules.yml:ro
      - ${FLEET_TARGETS_DIR:?Generate and audit the private fleet target directory}:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus

  grafana:
    ports: !reset []

  mediamtx:
    # Only the authenticated backend gateway may expose HLS to browsers.
    ports: !reset []
    environment:
      MTX_HLSCDNSECRET: ${MEDIA_HLS_SECRET:?Set a strong private media gateway secret}
      MTX_PATHDEFAULTS_PUBLISHPASS: ${MEDIAMTX_PUBLISH_PASSWORD:?Set a strong private media publisher password}

  ai-worker:
    volumes: !override
      - ./ai-worker/models:/app/models:ro
      - worker_1_state:/app/state
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${WORKER_1_GPU_DEVICE_ID:?Set an explicitly tested GPU device ID}"]
              capabilities: [gpu]
    environment:
      WORKER_API_KEY: ${WORKER_1_API_KEY:?Set the credential for worker-1}
      USE_GPU: "true"
      YOLO_MODEL_PATH: ${PPE_MODEL_PATH:-models/yolov8s-ppe.pt}
      YOLO_MODEL_SHA256: ${PPE_MODEL_SHA256:?Set the reviewed local PPE checkpoint SHA-256}
      MODEL_STALL_SECONDS: ${MODEL_STALL_SECONDS:-30}
      DETECTION_QUEUE_SIZE: ${DETECTION_QUEUE_SIZE:-32}
      DETECTION_TIMEOUT_SECONDS: ${DETECTION_TIMEOUT_SECONDS:-5}
      ENVIRONMENT: production
      DEMO_MODE: "false"
    ports: !reset []

  ai-worker-2:
    volumes: !override
      - ./ai-worker/models:/app/models:ro
      - worker_2_state:/app/state
    deploy:
      resources:
        reservations:
          devices: !override
            - driver: nvidia
              device_ids: ["${WORKER_2_GPU_DEVICE_ID:?Set an explicitly tested GPU device ID}"]
              capabilities: [gpu]
    environment:
      WORKER_API_KEY: ${WORKER_2_API_KEY:?Set the credential for worker-2}
      USE_GPU: "true"
      YOLO_MODEL_PATH: ${PPE_MODEL_PATH:-models/yolov8s-ppe.pt}
      YOLO_MODEL_SHA256: ${PPE_MODEL_SHA256:?Set the reviewed local PPE checkpoint SHA-256}
      MODEL_STALL_SECONDS: ${MODEL_STALL_SECONDS:-30}
      DETECTION_QUEUE_SIZE: ${DETECTION_QUEUE_SIZE:-32}
      DETECTION_TIMEOUT_SECONDS: ${DETECTION_TIMEOUT_SECONDS:-5}
      ENVIRONMENT: production
      DEMO_MODE: "false"
    ports: !reset []

  camera-feeder:
    # The synthetic/demo test-pattern feeder has no place in production —
    # real cameras are added via the Cameras page with their own RTSP URLs.
    profiles: ["disabled"]

  backend:
    volumes: !reset []
    ports: !reset []
    environment:
      MEDIA_HLS_SECRET: ${MEDIA_HLS_SECRET:?Set a strong private media gateway secret}
      ENVIRONMENT: production
      DEBUG: "false"
      MINIO_PUBLIC_SECURE: "true"
      CAMERA_ALLOWED_HOSTS: ${CAMERA_ALLOWED_HOSTS:?Set trusted camera hosts as a JSON array}
      WORKER_CREDENTIALS: ${WORKER_CREDENTIALS:?Set tenant-bound worker credentials as JSON}
    command: ["sh", "scripts/start.sh"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Left relative — nginx (this same container) reverse-proxies /api/
        # to the backend under one origin, so no CORS and no separate
        # public backend port needed.
        VITE_API_URL: ""
        # WebSocket URLs must be absolute (the browser's WebSocket API
        # doesn't accept relative ones) — set this to your real domain,
        # e.g. wss://factory.example.com. Required.
        VITE_WS_URL: ${VITE_WS_URL:?Set VITE_WS_URL to your production domain, e.g. wss://factory.example.com}
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8080:80"
