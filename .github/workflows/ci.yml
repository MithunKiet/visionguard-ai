name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src tests scripts/measure_fleet.py ../infra/capacity ../infra/monitoring ../infra/pilot ../infra/backup
      - name: Tests
        run: pytest --cov=src --cov-report=term-missing

  ai-worker:
    name: AI Worker — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Exercise validation and queue logic without the GPU inference stack.
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pydantic-settings structlog ruff httpx numpy==1.26.4 opencv-python-headless==4.10.0.84 prometheus-client==0.21.1 Pillow==12.3.0 aio-pika==9.4.3 minio==7.2.11
      - name: Lint (ruff)
        run: ruff check src/pipeline/ppe_validator.py src/pipeline/types.py src/pipeline/detector.py src/pipeline/batch_detector.py src/pipeline/camera_worker.py src/pipeline/frame_reader.py src/pipeline/capture_process.py src/main.py src/events src/health src/capacity src/config src/validation tests
      - name: Tests
        run: pytest

  model-readiness-cpu:
    name: Actual CPU model startup smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    env:
      TEST_MODEL_CPU_SMOKE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ultralytics==8.3.50 numpy==1.26.4 opencv-python==4.10.0.84 pydantic-settings==2.6.1 structlog==24.4.0 httpx==0.28.1 prometheus-client==0.21.1 pytest pytest-asyncio
      # Random local weights test the loader/predictor contract, not accuracy.
      - run: pytest tests/test_model_readiness.py -k actual_cpu_model --tb=short

  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capacity load-script syntax
        run: node --check ../infra/capacity/api-load.js
      - name: Type-check + build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:e2e

  integration:
    name: PostgreSQL and Redis regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vgtest
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: visionguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgtest -d visionguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: vgtest
          RABBITMQ_DEFAULT_PASS: test-only
          RABBITMQ_DEFAULT_VHOST: visionguard_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/visionguard_test
      DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/visionguard_test
      REDIS_URL: redis://localhost:6379/0
      TEST_BACKUP_PG_CLIENT_IMAGE: postgres:16-alpine
      TEST_RABBITMQ_URL: amqp://vgtest:test-only@localhost:5672/visionguard_test
      JWT_SECRET: test-only-secret-with-at-least-thirty-two-characters
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: TEST_CONFIG_BROKER=1 pytest tests/test_review_integration.py tests/test_notification_outbox.py tests/test_live_video.py tests/test_worker_scheduling.py tests/test_worker_failover.py tests/test_edge_replay.py tests/test_user_pagination.py tests/test_config_delivery.py tests/test_report_jobs.py tests/test_detection_health.py tests/test_corrective_actions.py tests/test_mfa.py tests/test_backup_recovery.py
      - name: Synthetic fleet workload smoke
        env:
          CAPACITY_DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/fleet_capacity_test
          DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/fleet_capacity_test
        run: |
          python - <<'PYCODE'
          import asyncio, asyncpg
          async def create():
              db = await asyncpg.connect("postgresql://vgtest:test-only@localhost:5432/postgres")
              await db.execute("CREATE DATABASE fleet_capacity_test")
              await db.close()
          asyncio.run(create())
          PYCODE
          alembic upgrade head
          python scripts/measure_fleet.py --factories 1 --cameras-per-factory 20 --workers-per-factory 1 --history-events 20 --history-cameras 5 --seconds 5 --events-per-second 2 --reads-per-second 3 --p95-ms 3000 --event-p95-ms 5000 --output ../capacity-results/ci-control-plane.json
      - name: Fleet discovery with real Prometheus
        run: |
          mkdir -p "$RUNNER_TEMP/fleet-targets"
          chmod 755 "$RUNNER_TEMP/fleet-targets"
          docker run -d --name fleet-prometheus --network host -v "$GITHUB_WORKSPACE/infra/monitoring/smoke-prometheus.yml:/etc/prometheus/prometheus.yml:ro" -v "$RUNNER_TEMP/fleet-targets:/etc/prometheus/targets:ro" prom/prometheus:v3.2.1 --config.file=/etc/prometheus/prometheus.yml --web.listen-address=127.0.0.1:19091
          trap 'docker rm -f fleet-prometheus' EXIT
          TEST_FLEET_PROMETHEUS_URL=http://127.0.0.1:19091 TEST_FLEET_TARGETS_DIR="$RUNNER_TEMP/fleet-targets" pytest tests/test_fleet_monitoring.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-control-plane
          path: capacity-results/ci-control-plane.json
      - name: Capacity monitoring rules
        run: docker run --rm --entrypoint promtool -v "$GITHUB_WORKSPACE/infra/prometheus:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules capacity.test.yml
      - name: Production configuration
        run: python ../infra/check_production_config.py

  production-image:
    name: Production frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile.prod -t visionguard-frontend:ci .

  windows-webcam:
    name: Windows webcam runner regressions
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ppe-trial-requirements.txt pytest
      - run: python -m pytest tests/test_webcam_validation.py tests/test_ppe_trial.py tests/test_ppe_evaluate.py tests/test_gpu_check.py
