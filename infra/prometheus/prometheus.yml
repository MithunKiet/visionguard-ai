global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/capacity.rules.yml

scrape_configs:
  - job_name: visionguard-backend
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: visionguard-ai-worker
    static_configs:
      - targets: ['ai-worker:8001', 'ai-worker-2:8001']
    metrics_path: /metrics
