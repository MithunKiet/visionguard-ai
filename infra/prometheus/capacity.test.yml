rule_files:
  - capacity.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'vg_model_ready{instance="failed"}'
        values: '0+0x10'
      - series: 'vg_model_ready{instance="ready"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: VisionGuardModelNotReady
        exp_alerts:
          - exp_labels: {instance: failed, severity: critical}
            exp_annotations:
              summary: Worker model readiness is unavailable
              description: Check checkpoint checksum, class mapping, CUDA device and startup or runtime failures before admitting cameras.
  - interval: 1m
    input_series:
      - series: 'vg_frames_discarded_total{instance="worker",camera_id="late",reason="stale_inference"}'
        values: '0+1x10'
      - series: 'vg_frames_discarded_total{instance="worker",camera_id="normal",reason="superseded"}'
        values: '0+100x10'
      - series: 'vg_capture_restarts_total{instance="worker",camera_id="stuck",reason="stalled"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: VisionGuardStaleFramesDiscarded
        exp_alerts:
          - exp_labels: {instance: worker, camera_id: late, severity: warning}
            exp_annotations:
              summary: Camera frames exceed the local freshness budget
              description: Inspect capture handoff and inference latency; this does not measure camera or DVR buffering.
      - eval_time: 10m
        alertname: VisionGuardCaptureRestarting
        exp_alerts:
          - exp_labels: {instance: worker, camera_id: stuck, severity: warning}
            exp_annotations:
              summary: A camera capture process repeatedly restarts
              description: Check stream connectivity, decode limits, process resources and the restart reason.
  - interval: 1m
    input_series:
      - series: 'vg_edge_rejected_total{instance="edge"}'
        values: '0+1x15'
      - series: 'vg_edge_oldest_age_seconds{instance="edge"}'
        values: '0+60x15'
      - series: 'vg_edge_assignment_cache_active{instance="edge"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: VisionGuardEdgeEventRejected
        exp_alerts:
          - exp_labels: {instance: edge, severity: critical}
            exp_annotations:
              summary: An incident could not be saved locally
              description: Check journal capacity, free disk, permissions and filesystem health; rejected incidents are not guaranteed recoverable.
      - eval_time: 10m
        alertname: VisionGuardEdgeDeliveryBacklog
        exp_alerts:
          - exp_labels: {instance: edge, severity: warning}
            exp_annotations:
              summary: Durable edge delivery is delayed
              description: Inspect pending event and evidence counts, broker routing and object storage; preserve the worker state volume.
      - eval_time: 10m
        alertname: VisionGuardUsingCachedAssignments
        exp_alerts:
          - exp_labels: {instance: edge, severity: warning}
            exp_annotations:
              summary: Worker is using temporary cached camera authorization
              description: Restore API connectivity before the cached authorization expires and camera tasks stop.
  - interval: 1m
    input_series:
      - series: 'vg_camera_target_fps{instance="worker",camera_id="slow"}'
        values: '2+0x15'
      - series: 'vg_frames_processed_total{instance="worker",camera_id="slow"}'
        values: '0+60x15'
      - series: 'vg_camera_last_processed_timestamp_seconds{instance="worker",camera_id="slow"}'
        values: '0+60x15'
      - series: 'vg_camera_target_fps{instance="worker",camera_id="inactive"}'
        values: '0+0x15'
      - series: 'vg_frames_processed_total{instance="worker",camera_id="inactive"}'
        values: '0+0x15'
      - series: 'vg_camera_last_processed_timestamp_seconds{instance="worker",camera_id="inactive"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: VisionGuardCameraBelowTarget
        exp_alerts:
          - exp_labels:
              instance: worker
              camera_id: slow
              severity: warning
            exp_annotations:
              summary: A camera is processing below its configured sample rate
              description: Check decode, inference and upload delays before adding cameras.
      - eval_time: 15m
        alertname: VisionGuardCameraProcessingStalled
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'vg_camera_lease_expirations_total{instance="worker-a",camera_id="camera-1"}'
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: VisionGuardCameraLeaseExpired
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: worker-a
              camera_id: camera-1
            exp_annotations:
              summary: A camera stopped after its ownership lease expired
              description: Check API connectivity and confirm a factory-local standby recovered the camera within the site RTO.
