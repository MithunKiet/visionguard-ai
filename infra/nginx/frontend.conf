# Serves the built React SPA and reverse-proxies API/WebSocket calls to the
# backend under the same origin — avoids CORS entirely in production and
# means the backend never needs to be exposed on its own public port.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /users, /cameras) aren't real
    # files — fall back to index.html and let the SPA's router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ws/ {
        proxy_pass http://backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html itself must never be cached — every deploy ships a new one,
    # and a stale cached copy would reference JS/CSS bundles that no longer
    # exist (they're content-hashed, old filenames 404 after a new build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
