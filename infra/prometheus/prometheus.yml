global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/capacity.rules.yml

scrape_configs:
  - job_name: visionguard-backend
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: visionguard-ai-worker
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 15s
    metrics_path: /metrics
