name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Tests
        run: pytest --cov=src --cov-report=term-missing

  ai-worker:
    name: AI Worker — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the light deps the unit tests need — ultralytics/torch/opencv
      # are runtime-only and far too heavy for CI test jobs.
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pydantic-settings structlog ruff httpx numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Lint (ruff)
        run: ruff check src/pipeline/ppe_validator.py src/pipeline/types.py src/config tests
      - name: Tests
        run: pytest

  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:e2e

  integration:
    name: PostgreSQL and Redis regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vgtest
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: visionguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vgtest -d visionguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: vgtest
          RABBITMQ_DEFAULT_PASS: test-only
          RABBITMQ_DEFAULT_VHOST: visionguard_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/visionguard_test
      DATABASE_URL: postgresql+asyncpg://vgtest:test-only@localhost:5432/visionguard_test
      REDIS_URL: redis://localhost:6379/0
      TEST_RABBITMQ_URL: amqp://vgtest:test-only@localhost:5672/visionguard_test
      JWT_SECRET: test-only-secret-with-at-least-thirty-two-characters
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest tests/test_review_integration.py tests/test_notification_outbox.py tests/test_live_video.py
      - name: Production configuration
        run: python ../infra/check_production_config.py

  production-image:
    name: Production frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile.prod -t visionguard-frontend:ci .
